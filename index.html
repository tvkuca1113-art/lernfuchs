<style>
/* ============================================================================
   LERNFUCHS — DESIGN SYSTEM
   All styling inline. Mobile-first, responsive, light/dark, accessible.
   ========================================================================== */

/* ---- Design tokens (light theme defaults) ------------------------------- */
:root{
  /* Brand palette */
  --brand:#ff7a1a;          /* fox orange */
  --brand-2:#ff9d4d;
  --brand-ink:#7a3800;
  --accent:#5b6cff;         /* playful violet-blue */
  --accent-2:#00c2a8;       /* teal */
  --gold:#ffb020;
  --silver:#b9c2d0;
  --bronze:#cd7f32;
  --good:#28c76f;
  --good-ink:#0f7a41;
  --bad:#ff4d5e;
  --bad-ink:#a01523;
  --heart:#ff4d6d;
  --gem:#33d6ff;
  --xp:#ffc531;
  --streak:#ff7a1a;

  /* Surfaces */
  --bg:#f3f5fb;
  --bg-2:#e9edf7;
  --surface:#ffffff;
  --surface-2:#f6f8fe;
  --surface-3:#eef1fb;
  --line:#e2e7f3;
  --line-strong:#cfd6ea;

  /* Text */
  --ink:#1c2333;
  --ink-2:#4a5570;
  --ink-3:#7d88a3;
  --ink-inv:#ffffff;

  /* Effects */
  --shadow-sm:0 1px 2px rgba(20,25,50,.06), 0 1px 3px rgba(20,25,50,.08);
  --shadow:0 4px 14px rgba(25,32,66,.10), 0 2px 4px rgba(25,32,66,.06);
  --shadow-lg:0 18px 50px rgba(25,32,66,.22), 0 6px 16px rgba(25,32,66,.12);
  --ring:0 0 0 3px rgba(91,108,255,.35);
  --radius:18px;
  --radius-sm:12px;
  --radius-lg:26px;

  /* Typography */
  --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-rounded: "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fs-base:16px;
  --lh:1.5;

  /* Motion */
  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.4,0,.2,1);
  --dur:.22s;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 68px;
}

/* Dark theme */
:root[data-theme="dark"]{
  --bg:#0d1020;
  --bg-2:#0a0d19;
  --surface:#161b2e;
  --surface-2:#1c2338;
  --surface-3:#232c46;
  --line:#2a3350;
  --line-strong:#3a4568;
  --ink:#eef1fb;
  --ink-2:#b6c0dc;
  --ink-3:#8391b4;
  --ink-inv:#0d1020;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 6px 20px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --surface:#161b2e;
}
/* Follow system when theme=auto */
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#0d1020; --bg-2:#0a0d19; --surface:#161b2e; --surface-2:#1c2338;
    --surface-3:#232c46; --line:#2a3350; --line-strong:#3a4568;
    --ink:#eef1fb; --ink-2:#b6c0dc; --ink-3:#8391b4; --ink-inv:#0d1020;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 6px 20px rgba(0,0,0,.45);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }
}

/* Accessibility: larger text mode */
:root[data-textsize="large"]{ --fs-base:18.5px; --lh:1.62; }
/* Dyslexia-friendly: increase spacing + weight, comic-like fallback */
:root[data-dyslexia="on"]{
  --font:"Comic Sans MS", "Segoe Print", "Trebuchet MS", var(--font-rounded);
  letter-spacing:.02em; word-spacing:.08em; --lh:1.7;
}

/* ---- Reset / base ------------------------------------------------------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ font-size:var(--fs-base); -webkit-text-size-adjust:100%; }
body{
  margin:0; font-family:var(--font); line-height:var(--lh);
  color:var(--ink); background:
    radial-gradient(1200px 600px at 100% -10%, rgba(255,122,26,.08), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(91,108,255,.08), transparent 55%),
    var(--bg);
  min-height:100dvh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background-color .3s var(--ease), color .3s var(--ease);
}
h1,h2,h3,h4,p{ margin:0; }
button{ font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit; }
a{ color:var(--accent); }
img,svg{ vertical-align:middle; }
ul{ margin:0; padding:0; list-style:none; }
input,select,textarea{ font-family:inherit; font-size:inherit; }

/* Focus visibility */
:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:8px; }
.btn:focus-visible, .tile:focus-visible, .navbtn:focus-visible{ box-shadow:var(--ring); }

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}
:root[data-reduce="on"] *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }

/* ---- App shell ---------------------------------------------------------- */
#app{ max-width:560px; margin:0 auto; padding: calc(var(--safe-top) + 8px) 14px calc(var(--nav-h) + var(--safe-bottom) + 20px); position:relative; }
.screen{ animation:screenIn .34s var(--ease) both; }
@keyframes screenIn{ from{ opacity:0; transform:translateY(8px) scale(.995);} to{ opacity:1; transform:none;} }

/* Top bar (stats) */
.topbar{
  position:sticky; top:var(--safe-top); z-index:40; display:flex; gap:8px; align-items:center;
  padding:10px 4px; margin:-4px -4px 8px; backdrop-filter:blur(10px);
  background:linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 70%, transparent));
}
.stat{ display:flex; align-items:center; gap:6px; font-weight:800; font-size:.95rem; padding:7px 11px; background:var(--surface); border:1px solid var(--line); border-radius:999px; box-shadow:var(--shadow-sm); white-space:nowrap; }
.stat .ic{ font-size:1.1rem; line-height:1; }
.stat.streak{ color:var(--streak); }
.stat.gem{ color:#12a6c9; }
.stat.xp{ color:#c98a00; }
.stat.hearts{ color:var(--heart); }
.stat .sub{ color:var(--ink-3); font-weight:700; font-size:.78rem; }
.stat.clickable{ cursor:pointer; transition:transform var(--dur) var(--spring); }
.stat.clickable:active{ transform:scale(.94); }
.spacer{ flex:1; }

/* Cards */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
.card + .card{ margin-top:14px; }
.card-title{ font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.muted{ color:var(--ink-3); }
.small{ font-size:.85rem; }
.center{ text-align:center; }

/* Buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:800; letter-spacing:.01em;
  padding:14px 18px; border-radius:16px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong);
  box-shadow:0 3px 0 var(--line-strong); transition:transform .12s var(--ease), box-shadow .12s var(--ease), background .2s; user-select:none; }
.btn:hover{ background:var(--surface-3); }
.btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--line-strong); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; box-shadow:none; }
.btn.block{ display:flex; width:100%; }
.btn.primary{ background:linear-gradient(180deg,var(--brand-2),var(--brand)); color:#fff; border-color:#e56200; box-shadow:0 4px 0 #c9560a; text-shadow:0 1px 0 rgba(0,0,0,.12); }
.btn.primary:hover{ filter:brightness(1.04); }
.btn.primary:active{ box-shadow:0 0 0 #c9560a; }
.btn.good{ background:linear-gradient(180deg,#3ee089,var(--good)); color:#063d20; border-color:#12a45a; box-shadow:0 4px 0 #12864a; }
.btn.bad{ background:linear-gradient(180deg,#ff6b7a,var(--bad)); color:#fff; border-color:#d62b3d; box-shadow:0 4px 0 #b2202f; }
.btn.accent{ background:linear-gradient(180deg,#7688ff,var(--accent)); color:#fff; border-color:#3f4fe0; box-shadow:0 4px 0 #2f3bc0; }
.btn.ghost{ background:transparent; box-shadow:none; border-color:var(--line); }
.btn.sm{ padding:9px 13px; border-radius:12px; font-size:.9rem; box-shadow:0 3px 0 var(--line-strong); }
.btn.lg{ padding:16px 22px; font-size:1.08rem; border-radius:18px; }
.btn.pill{ border-radius:999px; }

/* Chips */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-weight:700; font-size:.82rem; color:var(--ink-2); }
.chip.on{ background:color-mix(in srgb,var(--accent) 16%, var(--surface)); border-color:var(--accent); color:var(--accent); }

/* Progress bar */
.pbar{ height:14px; border-radius:999px; background:var(--surface-3); overflow:hidden; border:1px solid var(--line); }
.pbar > i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--brand-2),var(--brand)); width:0; transition:width .6s var(--spring); box-shadow:inset 0 -4px 6px rgba(0,0,0,.12); }
.pbar.thin{ height:9px; }
.pbar.good > i{ background:linear-gradient(90deg,#4fe393,var(--good)); }
.pbar.xp > i{ background:linear-gradient(90deg,#ffd861,var(--xp)); }

/* Progress ring (SVG based, .ring wrapper) */
.ring{ position:relative; display:inline-grid; place-items:center; }
.ring svg{ transform:rotate(-90deg); }
.ring .ring-bg{ stroke:var(--surface-3); }
.ring .ring-fg{ stroke:url(#ringgrad); stroke-linecap:round; transition:stroke-dashoffset .8s var(--spring); }
.ring .ring-label{ position:absolute; text-align:center; }

/* Hearts row */
.hearts{ display:inline-flex; gap:3px; align-items:center; }
.hearts .hx{ font-size:1.05rem; filter:drop-shadow(0 1px 1px rgba(0,0,0,.2)); transition:transform .3s var(--spring); }
.hearts .hx.empty{ filter:grayscale(1) opacity(.35); }

/* Tiles / grids */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid4{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.quicktiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tile{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; text-align:left; padding:16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); transition:transform .14s var(--spring), box-shadow .2s; }
.tile:hover{ box-shadow:var(--shadow); }
.tile:active{ transform:scale(.97); }
.tile .tile-ic{ font-size:1.5rem; }
.tile .tile-t{ font-weight:800; }
.tile .tile-s{ font-size:.8rem; color:var(--ink-3); }
.tile.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; justify-content:space-between; }

/* Section heading */
.sec-h{ display:flex; align-items:center; justify-content:space-between; margin:20px 4px 10px; }
.sec-h h2{ font-size:1.15rem; font-weight:900; letter-spacing:-.01em; }
.sec-h .link{ font-weight:800; color:var(--accent); font-size:.9rem; cursor:pointer; }

/* Learning path */
.levelband{ display:flex; align-items:center; gap:10px; margin:22px 0 6px; }
.levelband .lb-tag{ font-weight:900; font-size:.95rem; letter-spacing:.08em; padding:6px 12px; border-radius:999px; color:#fff; }
.levelband .lb-line{ flex:1; height:3px; border-radius:2px; background:var(--line); }
.lb-a1{ background:#28c76f;} .lb-a2{ background:#00b8d4;} .lb-b1{ background:#7c4dff;} .lb-b2{ background:#ff5c8a;}
.path{ position:relative; padding:6px 0 10px; }
.unit{ margin:10px 0 22px; }
.unit-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--radius); color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.unit-head h3{ font-size:1.02rem; font-weight:900; }
.unit-head p{ font-size:.82rem; opacity:.92; }
.unit-head .crowns{ margin-left:auto; display:flex; gap:2px; font-size:1.05rem; }
.nodes{ display:flex; flex-direction:column; align-items:center; gap:2px; padding-top:10px; }
.node-wrap{ position:relative; display:flex; justify-content:center; width:100%; }
.node-wrap:nth-child(odd){ transform:translateX(-56px); }
.node-wrap:nth-child(even){ transform:translateX(56px); }
.node-wrap:nth-child(3n){ transform:translateX(0); }
.node{ position:relative; width:74px; height:66px; border-radius:50%; display:grid; place-items:center; font-size:1.7rem;
  background:linear-gradient(180deg,var(--surface),var(--surface-2)); border:1px solid var(--line);
  box-shadow:0 6px 0 var(--line-strong), var(--shadow-sm); transition:transform .16s var(--spring); cursor:pointer; }
.node:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--line-strong); }
.node.locked{ filter:grayscale(.6) opacity(.6); cursor:not-allowed; }
.node.done{ background:linear-gradient(180deg,#4fe393,var(--good)); border-color:#12a45a; box-shadow:0 6px 0 #12864a; color:#063d20; }
.node.current{ background:linear-gradient(180deg,var(--brand-2),var(--brand)); border-color:#e56200; box-shadow:0 6px 0 #c9560a, 0 0 0 6px rgba(255,122,26,.18); color:#fff; animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
.node .lname{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:.62rem; font-weight:800; padding:2px 7px; border-radius:999px; white-space:nowrap; opacity:.9; }
.node .crown-badge{ position:absolute; bottom:-8px; right:-6px; font-size:.9rem; }
.node.review-due::after{ content:"!"; position:absolute; top:-6px; right:-4px; width:20px; height:20px; border-radius:50%; background:var(--bad); color:#fff; font-size:.75rem; font-weight:900; display:grid; place-items:center; box-shadow:var(--shadow-sm); }
.startpop{ position:absolute; top:-52px; left:50%; transform:translateX(-50%); z-index:5; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-lg); border-radius:14px; padding:10px; width:180px; text-align:center; animation:pop .2s var(--spring) both; }
.startpop::after{ content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%) rotate(45deg); width:14px; height:14px; background:var(--surface); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
@keyframes pop{ from{ opacity:0; transform:translateX(-50%) scale(.85);} to{ opacity:1; transform:translateX(-50%) scale(1);} }

/* ---- Lesson / exercise UI ---------------------------------------------- */
.lesson-top{ position:sticky; top:var(--safe-top); z-index:30; display:flex; align-items:center; gap:12px; padding:10px 2px; background:linear-gradient(var(--bg), color-mix(in srgb,var(--bg) 60%, transparent)); }
.xbtn{ font-size:1.4rem; color:var(--ink-3); width:40px; height:40px; border-radius:12px; }
.xbtn:hover{ background:var(--surface-2); color:var(--ink); }
.lesson-bar{ flex:1; }
.q-stem{ font-size:1.35rem; font-weight:900; letter-spacing:-.01em; line-height:1.3; }
.q-instr{ color:var(--ink-3); font-weight:800; font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
.exercise{ min-height:52vh; display:flex; flex-direction:column; }
.ex-body{ flex:1; padding-top:6px; }
.options{ display:grid; gap:11px; margin-top:16px; }
.opt{ display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:15px; background:var(--surface); border:2px solid var(--line); box-shadow:0 3px 0 var(--line-strong); font-weight:700; text-align:left; transition:transform .1s, border-color .15s, background .15s; }
.opt:hover{ border-color:var(--line-strong); }
.opt:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line-strong); }
.opt .kbd{ margin-left:auto; font-size:.7rem; color:var(--ink-3); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
.opt.sel{ border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%, var(--surface)); }
.opt.correct{ border-color:var(--good); background:color-mix(in srgb,var(--good) 16%, var(--surface)); color:var(--good-ink); }
.opt.wrong{ border-color:var(--bad); background:color-mix(in srgb,var(--bad) 14%, var(--surface)); color:var(--bad-ink); }
.opt.dim{ opacity:.5; }

.picgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.pic{ aspect-ratio:1/1; border-radius:18px; background:var(--surface); border:2px solid var(--line); box-shadow:0 4px 0 var(--line-strong); display:grid; place-items:center; font-size:3.4rem; transition:transform .1s, border-color .15s; }
.pic:active{ transform:translateY(2px); }
.pic .plabel{ position:absolute; bottom:6px; font-size:.7rem; color:var(--ink-3); }
.pic.correct{ border-color:var(--good); background:color-mix(in srgb,var(--good) 16%, var(--surface)); }
.pic.wrong{ border-color:var(--bad); background:color-mix(in srgb,var(--bad) 14%, var(--surface)); }

/* Word-bank / sentence builder */
.answer-line{ min-height:58px; border-bottom:2px dashed var(--line-strong); display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:8px 4px; margin:8px 0 18px; }
.bank{ display:flex; flex-wrap:wrap; gap:8px; min-height:52px; }
.word{ padding:11px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line-strong); box-shadow:0 3px 0 var(--line-strong); font-weight:800; transition:transform .12s var(--spring), opacity .2s; }
.word:active{ transform:translateY(2px) scale(.98); }
.word.used{ opacity:.25; pointer-events:none; }
.word.ghost{ background:var(--surface-3); color:transparent; box-shadow:none; border-style:dashed; }

/* Typing input */
.type-in{ width:100%; padding:15px 16px; border-radius:15px; border:2px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:800; font-size:1.15rem; box-shadow:var(--shadow-sm); }
.type-in:focus{ border-color:var(--accent); }
.umlauts{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.umlauts button{ width:46px; height:46px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line-strong); box-shadow:0 3px 0 var(--line-strong); font-weight:800; font-size:1.15rem; }
.umlauts button:active{ transform:translateY(2px); box-shadow:none; }

/* Gender buckets */
.buckets{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; }
.bucket{ min-height:120px; border-radius:16px; border:2px dashed var(--line-strong); padding:10px; text-align:center; transition:border-color .15s, background .15s; }
.bucket.der{ --bk:#4a8cff; } .bucket.die{ --bk:#ff5c8a; } .bucket.das{ --bk:#28c76f; }
.bucket b{ color:var(--bk); font-size:1.1rem; }
.bucket.hot{ border-color:var(--bk); background:color-mix(in srgb,var(--bk) 12%, var(--surface)); }
.noun-card{ margin:16px auto; max-width:260px; padding:20px; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); text-align:center; font-size:1.5rem; font-weight:900; }

/* Memory grid */
.memgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
.mcard{ aspect-ratio:3/4; border-radius:12px; background:linear-gradient(180deg,var(--brand-2),var(--brand)); border:none; box-shadow:0 3px 0 #c9560a; display:grid; place-items:center; color:#fff; font-weight:800; font-size:.8rem; padding:4px; text-align:center; transition:transform .3s var(--spring); transform-style:preserve-3d; }
.mcard.flip{ background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow-sm); }
.mcard.matched{ background:color-mix(in srgb,var(--good) 22%, var(--surface)); color:var(--good-ink); box-shadow:none; opacity:.85; }
.mcard .qm{ font-size:1.6rem; }

/* Feedback footer */
.feedback{ position:sticky; bottom:0; margin:14px -14px calc(var(--safe-bottom) * -1); padding:16px 16px calc(16px + var(--safe-bottom)); border-top-left-radius:22px; border-top-right-radius:22px; box-shadow:0 -10px 30px rgba(0,0,0,.08); animation:slideUp .28s var(--spring) both; }
@keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:none;} }
.feedback.ok{ background:color-mix(in srgb,var(--good) 16%, var(--surface)); }
.feedback.no{ background:color-mix(in srgb,var(--bad) 14%, var(--surface)); }
.feedback .fb-head{ display:flex; align-items:center; gap:10px; font-weight:900; font-size:1.1rem; }
.feedback.ok .fb-head{ color:var(--good-ink); }
.feedback.no .fb-head{ color:var(--bad-ink); }
.feedback .fb-expl{ margin-top:6px; font-size:.92rem; color:var(--ink-2); font-weight:600; }
.feedback .fb-expl b{ color:var(--ink); }

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || (I18N.en[key]) || key;
  if(vars) for(const [k,v] of Object.entries(vars)) s = s.replace(new RegExp('\\{'+k+'\\}','g'), v);
  return s;
}
// Native-language translation for a vocab item (BS or EN side)
function nativeOf(item){ return (LANG==='en' ? (item.en||item.bs) : (item.bs||item.en)) || ''; }

/* ============================================================================
   2. CONTENT — the German curriculum (data-driven, correctness first)
   ----------------------------------------------------------------------------
   HOW TO ADD CONTENT (for non-programmers):
   • A vocab item is one object in RAW_VOCAB. Copy an existing line and change
     the values. Fields:
        de   – the German word (for nouns include NO article here)
        art  – 'der' | 'die' | 'das'  (only for nouns; leave out otherwise)
        pl   – plural form (nouns), e.g. 'Häuser' or '-e'
        bs   – Bosnian meaning        en – English meaning
        pos  – 'noun'|'verb'|'adj'|'adv'|'num'|'phrase'|'prep'|'pron'
        ex   – a German example sentence (optional)
        exbs / exen – its translation (optional)
        pr   – pronunciation hint (optional, learner-friendly respelling)
        emoji– a single emoji for picture exercises (optional)
        topic– short topic id (groups words)   lvl – 'A1'|'A2'|'B1'|'B2'
   • Stable ids are generated from the word, so saved progress survives edits.
   ========================================================================== */
function translit(s){ return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

/* ---- Finalize vocab: stable ids + fast lookup indexes ------------------- */
(function finalizeVocab(){
  const used = Object.create(null);
  for(const w of RAW_VOCAB){
    let base = translit((w.art? w.art+'_' : '') + w.de) || 'w';
    let id = base, k = 2;
    while(used[id]){ id = base+'_'+(k++); }
    used[id] = true;
    w.id = id;
    w.lvl = w.lvl || 'A1';
    // A quick display headword: nouns show article
    w.head = w.art ? (w.art+' '+w.de) : w.de;
  }
})();

// Gender pattern hint from a noun's ending (teaching aid, ~reliable rules)
function genderHint(de){
  const w = de.toLowerCase();
  const rules = [
    [/(ung|heit|keit|schaft|ion|tät|ei|ie|ur)$/, 'die', {bs:'Nastavci -ung, -heit, -keit, -schaft, -ion, -tät → skoro uvijek die.', en:'Endings -ung, -heit, -keit, -schaft, -ion, -tät → almost always die.'}],
    [/(chen|lein)$/, 'das', {bs:'Umanjenice na -chen / -lein → uvijek das (i biološki rod se gubi).', en:'Diminutives -chen / -lein → always das.'}],
    [/(ment|um|tum)$/, 'das', {bs:'Nastavci -ment, -um, -tum → das.', en:'Endings -ment, -um, -tum → das.'}],
    [/(ling|ismus|or|ant)$/, 'der', {bs:'Nastavci -ling, -ismus, -or, -ant → der.', en:'Endings -ling, -ismus, -or, -ant → der.'}],
    [/(er)$/, 'der', {bs:'Vršioci radnje na -er su često der (der Lehrer). Ima izuzetaka.', en:'Agent nouns in -er are often der (der Lehrer). Some exceptions.'}],
    [/(e)$/, 'die', {bs:'Mnoge imenice na -e su die (die Katze) — ali ne sve.', en:'Many nouns ending in -e are die (die Katze) — not all.'}],
  ];
  for(const [re, art, note] of rules){ if(re.test(w)) return {art, note}; }
  return null;
}

/* ============================================================================
   4. STORAGE — localStorage persistence + export/import + migration hook
   ========================================================================== */
const STORAGE_KEY = 'lernfuchs.state';
let _saveTimer = null;
function save(){ // debounced
  if(_saveTimer) return;
  _saveTimer = setTimeout(()=>{ _saveTimer=null;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
    catch(e){ console.warn('Save failed', e); }
  }, 250);
}
function saveNow(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }

function migrate(data){
  // Schema migration hook — runs when stored version < current.
  if(!data || typeof data!=='object') return DEFAULT_STATE();
  const base = DEFAULT_STATE();
  // Deep-merge stored data onto defaults so new fields always exist.
  const merged = deepMerge(base, data);
  if((data.v||0) < SCHEMA_VERSION){
    // future migrations go here, keyed by version
    merged.v = SCHEMA_VERSION;
  }
  return merged;
}
function deepMerge(base, over){
  if(Array.isArray(base)) return Array.isArray(over)? over : base;
  if(base && typeof base==='object'){
    const out = Array.isArray(base)? [] : {...base};
    for(const k of Object.keys(base)) out[k] = (k in (over||{})) ? deepMerge(base[k], over[k]) : base[k];
    for(const k of Object.keys(over||{})) if(!(k in base)) out[k] = over[k];
    return out;
  }
  return (over===undefined? base : over);
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    S = raw ? migrate(JSON.parse(raw)) : DEFAULT_STATE();
  }catch(e){ console.warn('Load failed, resetting', e); S = DEFAULT_STATE(); }
  LANG = S.settings.lang || 'bs';
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = el('a', {href:url, download:'lernfuchs-backup-'+dateKey()+'.json'});
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importData(file, cb){
  const r = new FileReader();
  r.onload = ()=>{ try{ S = migrate(JSON.parse(r.result)); saveNow(); cb&&cb(true); }catch(e){ cb&&cb(false); } };
  r.readAsText(file);
}

/* ============================================================================
   5. SRS — SM-2 / Leitner spaced repetition. Every vocab item & grammar point
   is a "card" with ease, interval, reps, dueDate and a decaying strength.
   ========================================================================== */
function freshCard(){ return { ease:2.5, interval:0, reps:0, due:dateKey(), last:dateKey(), strength:0, lapses:0 }; }
function getCard(id){ if(!S.cards[id]) S.cards[id]=freshCard(); return S.cards[id]; }

// quality 0..5 (we pass 5=fast correct, 4=correct, 2=slow/hint, 1=wrong)
function reviewCard(id, quality){
  const c = getCard(id);
  const today = dateKey();
  if(quality < 3){
    c.reps = 0; c.interval = 1; c.lapses++;
    c.strength = Math.max(0, c.strength - 0.35);
  }else{
    c.reps += 1;
    if(c.reps===1) c.interval = 1;
    else if(c.reps===2) c.interval = 6;
    else c.interval = Math.round(c.interval * c.ease);
    // SM-2 ease update
    c.ease = Math.max(1.3, c.ease + (0.1 - (5-quality)*(0.08 + (5-quality)*0.02)));
    c.strength = Math.min(1, c.strength + 0.18 + (quality===5?0.07:0));
  }
  c.last = today;
  c.due = addDays(today, Math.max(1, c.interval));
  S.learned[id] = true;
  save();
  return c;
}
// Strength decays over time toward 0 as the card gets "stale" past its interval.
function strengthOf(id){
  const c = S.cards[id]; if(!c) return 0;
  const elapsed = daysBetween(c.last, dateKey());
  const horizon = Math.max(1, c.interval || 1);
  const decay = clamp(elapsed / (horizon*1.6), 0, 1);
  return clamp(c.strength * (1 - 0.6*decay), 0, 1);
}
function isDue(id){ const c=S.cards[id]; return c && daysBetween(dateKey(), c.due) <= 0; }
function dueCardIds(){ return Object.keys(S.cards).filter(id=>isDue(id)); }
function weakCardIds(n=20){
  return Object.keys(S.cards)
    .map(id=>({id, s:strengthOf(id)}))
    .sort((a,b)=>a.s-b.s)
    .slice(0,n).map(o=>o.id);
}

/* ============================================================================
   6. AUDIO — WebAudio SFX (mutable) + SpeechSynthesis German TTS
   ========================================================================== */
const Audio_ = (function(){
  let ctx = null;
  function ensure(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function tone(freq, start, dur, type='sine', gain=0.14){
    if(!S.settings.sound) return; const c=ensure(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, c.currentTime+start);
    g.gain.setValueAtTime(0, c.currentTime+start);
    g.gain.linearRampToValueAtTime(gain, c.currentTime+start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+start+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.02);
  }
  const sfx = {
    click:()=>tone(440,0,0.05,'triangle',0.06),
    correct:()=>{ tone(660,0,0.09,'sine',0.12); tone(880,0.08,0.12,'sine',0.12); },
    wrong:()=>{ tone(200,0,0.16,'sawtooth',0.10); tone(150,0.12,0.18,'sawtooth',0.08); },
    coin:()=>{ tone(988,0,0.06,'square',0.07); tone(1319,0.05,0.10,'square',0.07); },
    complete:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.18,'sine',0.11)); },
    levelup:()=>{ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.10,0.30,'sine',0.13)); tone(1568,0.55,0.5,'sine',0.10); },
    badge:()=>{ tone(784,0,0.12,'triangle',0.12); tone(1175,0.1,0.2,'triangle',0.1); },
  };
  function play(name){ try{ (sfx[name]||(()=>{}))(); }catch(e){} }

  // German TTS
  let voices = [];
  function loadVoices(){ voices = (window.speechSynthesis? speechSynthesis.getVoices():[]) || []; }
  if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function germanVoice(){
    if(!voices.length) loadVoices();
    if(S.settings.voice){ const v=voices.find(v=>v.name===S.settings.voice); if(v) return v; }
    return voices.find(v=>/de[-_]DE/i.test(v.lang)) || voices.find(v=>/^de/i.test(v.lang)) || null;
  }
  function speak(text, opts={}){
    if(!window.speechSynthesis) return false;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='de-DE'; const v=germanVoice(); if(v) u.voice=v;
      u.rate = opts.rate!=null? opts.rate : 0.92; u.pitch = 1;
      speechSynthesis.speak(u); return true;
    }catch(e){ return false; }
  }
  function listVoices(){ if(!voices.length) loadVoices(); return voices.filter(v=>/^de/i.test(v.lang)); }
  return { play, speak, ensure, listVoices, hasTTS:()=>!!window.speechSynthesis };
})();

/* ============================================================================
   7. AI — Claude API client with graceful offline fallbacks.
   SECURITY: a raw client-side key is for LOCAL/DEMO use only. In production
   (Part B) all AI calls must be proxied through a backend so the key is never
   exposed to the browser. See the roadmap.
   ========================================================================== */
const CLAUDE_API_KEY = "PASTE_YOUR_KEY_HERE";        // ← paste your key for demo AI
const CLAUDE_MODEL   = "claude-3-5-sonnet-latest";
const AI_ENABLED = !!CLAUDE_API_KEY && CLAUDE_API_KEY !== "PASTE_YOUR_KEY_HERE";

async function askClaude(system, user, {maxTokens=400, timeout=20000}={}){
  if(!AI_ENABLED) throw new Error('NO_KEY');
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), timeout);
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':CLAUDE_API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({ model:CLAUDE_MODEL, max_tokens:maxTokens, system, messages:[{role:'user', content:user}] }),
      signal:ctrl.signal,
    });
    clearTimeout(tid);
    if(res.status===429) throw new Error('RATE_LIMIT');
    if(!res.ok) throw new Error('HTTP_'+res.status);
    const data = await res.json();
    return (data.content && data.content[0] && data.content[0].text) || '';
  }catch(e){ clearTimeout(tid); throw e; }
}

/* ---- Levels ---- */
function levelInfo(xp){
  let level=1, floorXp=0, need=100;
  while(xp >= floorXp+need){ floorXp += need; level++; need = 80 + level*40; }
  return { level, floorXp, need, into: xp-floorXp, nextAt: floorXp+need, pct:(xp-floorXp)/need };
}

/* ---- Day rollover ---- */
function rolloverDay(){
  const today = dateKey();
  if(S.today.date!==today){
    if(S.today.xp>0) S.history[S.today.date] = S.today.xp;
    S.today = { date:today, xp:0, lessons:0, newWords:0, listening:0, genderCorrect:0, answers:0 };
  }
  if(S.ai.date!==today){ S.ai.date=today; S.ai.count=0; }
  ensureQuests(); ensureLeague();
}

/* ---- Streak (respects local day boundaries + streak-freeze item) ---- */
function streakAlive(){ if(!S.streak.last) return S.streak.count>0; const g=daysBetween(S.streak.last, dateKey()); return g<=1 || (g===2 && S.streak.freezes>0); }
function checkStreakOnLoad(){
  if(S.streak.last){ const g=daysBetween(S.streak.last, dateKey());
    if(g>=2 && !(g===2 && S.streak.freezes>0)) S.streak.count=0; }
}
function registerActivity(){ // called the moment the user earns XP
  rolloverDay();
  const today = dateKey();
  if(S.streak.last!==today){
    if(!S.streak.last){ S.streak.count=1; }
    else { const g=daysBetween(S.streak.last, today);
      if(g===1) S.streak.count++;
      else if(g===2 && S.streak.freezes>0){ S.streak.freezes--; S.streak.frozenOn=addDays(today,-1); S.streak.count++; toast('🧊 '+t('streak_freeze')+' '+t('owned').toLowerCase()); }
      else S.streak.count=1;
    }
    S.streak.last = today;
  }
}

/* ---- XP (with level-up detection) ---- */
function addXp(n){
  if(n<=0) return {leveled:false};
  registerActivity();
  const before = levelInfo(S.xp).level;
  S.xp += n; S.today.xp += n;
  const after = levelInfo(S.xp).level;
  leagueGain(n);
  questProgress('xp', n);
  save();
  const leveled = after>before;
  if(leveled) onLevelUp(after);
  checkAchievements();
  return { leveled, level:after };
}

/* ---- Hearts (regen over time) ---- */
function heartIntervalMs(){ return HEART_REGEN_MIN*60*1000; }
function regenHearts(){
  if(isPlus()){ S.hearts.count=S.hearts.max; return; }
  if(S.hearts.count>=S.hearts.max){ S.hearts.lastRegen=now(); return; }
  const iv = heartIntervalMs();
  const elapsed = now() - (S.hearts.lastRegen||now());
  const gained = Math.floor(elapsed / iv);
  if(gained>0){
    S.hearts.count = Math.min(S.hearts.max, S.hearts.count + gained);
    S.hearts.lastRegen = (S.hearts.count>=S.hearts.max) ? now() : (S.hearts.lastRegen + gained*iv);
    save();
  }
}
function nextHeartMs(){ if(isPlus()||S.hearts.count>=S.hearts.max) return 0; return Math.max(0, heartIntervalMs() - (now() - (S.hearts.lastRegen||now()))); }
function loseHeart(){
  if(isPlus()) return S.hearts.max;
  if(S.hearts.count>=S.hearts.max) S.hearts.lastRegen = now(); // start the clock from full
  S.hearts.count = Math.max(0, S.hearts.count-1);
  save(); return S.hearts.count;
}
function gainHeart(n=1){ S.hearts.count=Math.min(S.hearts.max, S.hearts.count+n); save(); }
function heartsLeft(){ return isPlus()? Infinity : S.hearts.count; }

const QUEST_POOL = [
  {id:'q_xp20', type:'xp', target:20, reward:15, icon:'⭐', key:'quest_xp'},
  {id:'q_xp40', type:'xp', target:40, reward:25, icon:'🌟', key:'quest_xp'},
  {id:'q_listen', type:'listening', target:1, reward:10, icon:'🎧', key:'quest_listen'},
  {id:'q_gender5', type:'gender', target:5, reward:15, icon:'🎯', key:'quest_gender'},
  {id:'q_lesson2', type:'lesson', target:2, reward:20, icon:'📚', key:'quest_lesson'},
  {id:'q_perfect', type:'perfect', target:1, reward:20, icon:'💎', key:'quest_perfect'},
  {id:'q_words5', type:'words', target:5, reward:15, icon:'🧠', key:'quest_words'},
];
function ensureQuests(){
  const today = dateKey();
  if(!S.quests || S.quests.date!==today){
    // deterministic-ish daily rotation by date so it feels stable within a day
    const seed = parseInt(today.replace(/-/g,''),10);
    const shuffled = QUEST_POOL.map((q,i)=>({q, k:(seed*(i+7))%997})).sort((a,b)=>a.k-b.k).map(o=>o.q);
    const chosen = [];
    const seenType = new Set();
    for(const q of shuffled){ if(seenType.has(q.type)) continue; seenType.add(q.type); chosen.push({...q, progress:0, done:false}); if(chosen.length>=3) break; }
    S.quests = { date:today, list:chosen };
  }
}
function questProgress(type, amount=1){
  if(!S.quests) ensureQuests();
  for(const q of S.quests.list){
    if(q.done || q.type!==type) continue;
    q.progress = Math.min(q.target, q.progress + amount);
    if(q.progress>=q.target){ q.done=true; S.gems += q.reward; toast('✅ '+questLabel(q)+'  +'+q.reward+' 💎','win'); Audio_.play('coin'); }
  }
  save();
}
function questLabel(q){ return t(q.key, {n:q.target}); }

/* ---- Unit / crown progress ---- */
function unitState(id){ if(!S.units[id]) S.units[id]={done:[], crown:0, xp:0}; return S.units[id]; }
function unitProgress(id){
  const u=UNIT_BY_ID[id]; const st=unitState(id);
  const done = st.done.filter(Boolean).length;
  return { done, total:u.lessons, pct: done/u.lessons };
}
// Crown tier 0..3 (bronze→silver→gold) from completion + average strength of the unit's words
function unitCrown(id){
  const u=UNIT_BY_ID[id]; const p=unitProgress(id);
  if(p.done<u.lessons) return 0;
  const words=unitVocab(u); if(!words.length) return 1;
  const avg = words.reduce((s,w)=>s+strengthOf(w.id),0)/words.length;
  if(avg>=0.75) return 3; if(avg>=0.45) return 2; return 1;
}
function unitReviewDue(id){ const u=UNIT_BY_ID[id]; return unitProgress(id).done>0 && unitVocab(u).some(w=>isDue(w.id)); }
// Is a unit unlocked? First unit always; otherwise previous unit must have ≥1 lesson done.
function unitUnlocked(index){
  if(index<=0) return true;
  const prev=UNITS[index-1]; return unitProgress(prev.id).done>0 || S.placementDone && placementUnlocks(index);
}
function placementUnlocks(index){ return (S._placementLevel||0) >= UNITS[index].lvlIndex; }
UNITS.forEach(u=>{ u.lvlIndex = LEVELS.indexOf(u.lvl); });

function toast(msg, kind){
  const box=$('#toasts'); if(!box) return;

/* ---- Confetti + particles ---- */
const FX = (function(){
  const canvas=$('#fx'); const ctx=canvas.getContext('2d');
  let parts=[], raf=null, dpr=1;
  const COLORS=['#ff7a1a','#ffb020','#5b6cff','#28c76f','#33d6ff','#ff4d6d','#a26bff','#ffd861'];
  function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function spawn(x,y,n,power){
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=power*(0.4+Math.random());
      parts.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - power*0.6, g:0.18+Math.random()*0.12,
        s:5+Math.random()*7, rot:Math.random()*6.28, vr:(Math.random()-.5)*0.4,
        col:COLORS[(Math.random()*COLORS.length)|0], life:0, max:70+Math.random()*50, shape:Math.random()<0.5?'r':'c' }); }
  }
  function loop(){
    ctx.clearRect(0,0,innerWidth,innerHeight); let alive=0;
    for(const p of parts){ if(p.life>p.max) continue; alive++;
      p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      const o=Math.max(0,1-p.life/p.max); ctx.globalAlpha=o; ctx.fillStyle=p.col;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if(p.shape==='r'){ ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); } else { ctx.beginPath(); ctx.arc(0,0,p.s/2,0,6.28); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha=1;
    parts=parts.filter(p=>p.life<=p.max);
    if(alive>0){ raf=requestAnimationFrame(loop); } else { raf=null; ctx.clearRect(0,0,innerWidth,innerHeight); }
  }
  function fire(opts={}){
    if(reduceMotion()){ return; }
    resize();
    const cx=opts.x!=null?opts.x:innerWidth/2, cy=opts.y!=null?opts.y:innerHeight*0.4;
    const big=opts.big;
    spawn(cx,cy, big?120:60, big?9:6);
    if(big){ spawn(cx-90,cy+20,50,8); spawn(cx+90,cy+20,50,8); }
    if(!raf) loop();
  }
  window.addEventListener('resize', ()=>{ if(raf) resize(); });
  return { fire };
})();

/* ============================================================================
   10. EXERCISES — answer normalization, generators, and the 11 game modes.
   Each builder returns { node, auto?, ready(), result() }.
   • auto:true  → mode submits itself via Lesson.submit (tap-to-answer modes)
   • otherwise  → Lesson shows a Check button gated by ready(), reads result()
   result() → { correct, correctText, explain, quality, cardId }
   ========================================================================== */
function canon(s){ return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:„“"'()\-]/g,'').replace(/\s+/g,' ').trim(); }
function meaningSet(str){ return new Set(String(str||'').split(/[\/,;]| oder | or /i).map(x=>canon(x.replace(/^(to |the |a |an )/,''))).filter(Boolean)); }
function insertAtCursor(input, text){ const s=input.selectionStart??input.value.length, e=input.selectionEnd??input.value.length; input.value=input.value.slice(0,s)+text+input.value.slice(e); const p=s+text.length; input.setSelectionRange(p,p); input.focus(); }
function umlautBar(input){
  const bar=el('div',{class:'umlauts', 'aria-label':t('umlaut_help')});
  ['ä','ö','ü','ß','Ä','Ö','Ü'].forEach(ch=> bar.append(el('button',{type:'button', text:ch, onclick:()=>insertAtCursor(input,ch)})));
  return bar;
}

/* ---- Conjugation form resolver (handles separable verbs) ---- */
function conjForm(verbDe, personKey, tense){
  const sepBase = SEP_BASE[verbDe];
  const base = sepBase || verbDe;
  const table = CONJ[base]; if(!table) return null;
  if(tense==='praes'||tense==='praet'){
    const form = (table[tense]||{})[personKey]; if(!form) return null;
    return { finite:form, particle: sepBase? verbDe.slice(0, verbDe.length-base.length) : '' };
  }
  return null;
}

  );
  const line=node.querySelector('.answer-line'); const bank=node.querySelector('.bank');
  const scrambled=shuffle(tokens.map((w,idx)=>({w,idx})));
  scrambled.forEach(tk=>{
    const b=el('button',{class:'word', text:tk.w, onclick:()=>{

// 10) Speak it (SpeechRecognition + graceful fallback)
EX.speak = function(item){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const node=el('div',{},
    el('div',{class:'q-instr', text:t('say_it')}),
    el('div',{class:'q-stem row', style:'gap:10px'}, el('span',{text:item.text}),

    el('div',{class:'small muted', style:'margin-top:6px', text:nativeOf(item.native||{})}),
    el('div',{class:'center', style:'margin-top:18px'})
  );
  const zone=node.querySelector('.center');
  // Always-available self-rate fallback so the learner is never stuck (no mic, denied permission, etc.)
  const saidItBtn=el('button',{class:'btn good block', style:'margin-top:12px', onclick:()=>Lesson.submit({correct:true, correctText:item.text, explain:'', quality:3, cardId:item.cardId}), text:'✅ '+t('i_said_it')});
  if(SR){
    const micBtn=el('button',{class:'btn accent lg pill', html:'🎤 '+t('say_it')});
    const status=el('div',{class:'small muted', style:'margin-top:10px'});
    zone.append(micBtn, status, saidItBtn);
    micBtn.onclick=()=>{
      try{
        const rec=new SR(); rec.lang='de-DE'; rec.interimResults=false; rec.maxAlternatives=3;
        status.textContent='🎙️ …'; micBtn.disabled=true;
        rec.onresult=(e)=>{ const said=Array.from(e.results[0]).map(r=>r.transcript); const ok=said.some(x=>canon(x)===canon(item.text) || canon(x).includes(canon(item.text)));
          Lesson.submit({correct:ok, correctText:item.text, explain:ok?('👏 „'+said[0]+'“'):(''+t('try_again')+' — „'+(said[0]||'')+'“'), quality:ok?5:2, cardId:item.cardId}); };
        rec.onerror=()=>{ micBtn.disabled=false; status.textContent='⚠️'; };
        rec.onend=()=>{ micBtn.disabled=false; };
        rec.start();
      }catch(e){ status.textContent=''; }
    };
  }else{
    zone.append(el('div',{class:'info-note', text:t('speak_unsupported')}), saidItBtn);
  }
  return { node, auto:true };
};

/* ---- Exercise generators (resolve payloads from content) ---------------- */
function otherWords(exclude, pool, n, filter){
  const cands=uniq((pool||VOCAB).filter(w=>w.id!==exclude.id && (!filter||filter(w))));
  return sample(cands, n);
}
function genTrans(w, pool, dir){
  const distr = otherWords(w, pool.length>=5?pool:vocabByLevel(w.lvl), 3, x=>x.pos===w.pos) ;
  const four = shuffle([w, ...distr]).slice(0,4);
  if(!four.includes(w)) four[0]=w;
  if(dir==='de2nat'){
    return { mode:'trans', dir, word:w, prompt:w.head, answerId:w.id, correctText:w.head+' — '+nativeOf(w),
      options: shuffle([w,...distr]).slice(0,4).map(x=>({id:x.id, label:nativeOf(x)})) };
  }
  return { mode:'trans', dir:'nat2de', word:w, prompt:nativeOf(w), answerId:w.id, correctText:nativeOf(w)+' → '+w.head,
    options: shuffle([w,...distr]).slice(0,4).map(x=>({id:x.id, label:x.head})) };
}
function genPic(w, lvl){
  if(!w||!w.emoji) return null;
  const pool = nounsWithEmoji().filter(x=>x.id!==w.id);
  const distr = sample(pool, 3);
  if(distr.length<3) return null;
  return { mode:'pic', word:w, options:[w, ...distr] };
}
function genListen(w){ return { mode:'listen', text:w.de, native:w, cardId:w.id }; }
function genListenSentence(s){ return { mode:'listen', text:s.de, native:s, cardId:'listen_'+canon(s.de).slice(0,14) }; }
function genSpeak(w){ return { mode:'speak', text:w.de, native:w, cardId:w.id }; }
function genGender(w){ if(!w||!w.art) return null; return { mode:'gender', word:w }; }
function genMemory(words){
  const pick=sample(words.filter(w=>nativeOf(w).length<22), 4);
  if(pick.length<4) return null;
  return { mode:'memory', pairs:pick.map(w=>({de:w.de, nat:nativeOf(w)})), cardId:'mem_'+pick[0].id };
}
function genBuild(s){ return { mode:'build', sentence:s }; }
function genCloze(s, lvl){
  const bank = uniq(SENTENCES.map(x=>x.blank).concat(['der','die','das','ist','habe','einen','mit','weil','nicht','auf']));
  const distr = sample(bank.filter(b=>canon(b)!==canon(s.blank)), 3);
  if(distr.length<3) return null;
  return { mode:'cloze', sentence:s, blank:s.blank, options:[s.blank, ...distr] };
}
function genCase(w, kase){
  if(!w||!w.art) return null;
  const g = GENDER_FROM_ART[w.art];
  const answer = ARTICLES.def[kase][g];
  if(!answer||answer==='—') return null;
  const prompts = {
    nom:{html:`Das ist ____ <b>${w.de}</b>.`, ex:'Nominativ = subjekt.'},
    akk:{html:`Ich sehe ____ <b>${w.de}</b>.`, ex:'sehen + Akkusativ.'},
    dat:{html:`Ich helfe ____ <b>${w.de}</b>.`, ex:'helfen + Dativ.'},
    gen:{html:`die Farbe ____ <b>${w.de}</b>`, ex:'Genitiv = pripadnost.'},
  }[kase];
  const cands = uniq([].concat(...['nom','akk','dat','gen'].map(k=>Object.values(ARTICLES.def[k]))).filter(a=>a!=='—'));
  const distr = sample(cands.filter(a=>a!==answer), 3);
  return { mode:'case', noun:w.head, gender:g, kase, answer, options:[answer,...distr],
    promptHtml:prompts.html, explain:CASE_LABEL[kase]+' '+({m:'(m)',f:'(f)',n:'(n)'}[g])+' → '+answer+'. '+prompts.ex };
}
function genConj(w, tense){
  const base = SEP_BASE[w.de]||w.de;
  if(!CONJ[base]) return null;
  const person = pick(PERSONS);
  const form = conjForm(w.de, person.key, tense);
  if(!form) return null;
  return { mode:'conj', verbHead:w.head, base:w.de, person, tense, answer:form.finite, particle:form.particle,
    explain:'Infinitiv: '+w.de+' — '+nativeOf(w) };
}

/* ---- buildLesson: assemble 8–12 exercises from a unit's content --------- */
function buildLesson(unitId, idx){
  const u=UNIT_BY_ID[unitId];
  const words=unitVocab(u).filter(w=>w.pos!=='prep');
  const nouns=words.filter(w=>w.pos==='noun');
  const verbs=words.filter(w=>w.pos==='verb');
  const lvl=u.lvl; const gids=u.grammar; const has=id=>gids.includes(id);
  const items=[];
  if(idx===0 && gids.length) items.push({mode:'teach', gid:gids[0]});

  const cand=[];
  shuffle(words).slice(0,5).forEach((w,k)=> cand.push(genTrans(w, words, k%2? 'nat2de':'de2nat')));
  shuffle(nouns.filter(w=>w.emoji)).slice(0,2).forEach(w=> cand.push(genPic(w,lvl)));
  shuffle(words).slice(0,2).forEach(w=> cand.push(genListen(w)));
  if(words.length>=4) cand.push(genMemory(words));
  shuffle(words).slice(0,1).forEach(w=> cand.push(genSpeak(w)));

  if(has('g_artikel')) shuffle(nouns).slice(0,3).forEach(w=> cand.push(genGender(w)));
  if(has('g_akkusativ')||has('g_dativ')||has('g_genitiv')){
    const kase= has('g_genitiv')?'gen': has('g_dativ')?'dat':'akk';
    shuffle(nouns.length?nouns:vocabByLevel(lvl).filter(w=>w.pos==='noun')).slice(0,3).forEach(w=> cand.push(genCase(w,kase)));
  }
  if(has('g_praesens')||has('g_seinhaben')||has('g_perfekt')||has('g_modal')||has('g_trennbar')||has('g_praeteritum')){
    const tense= has('g_praeteritum')?'praet':'praes';
    const vpool = verbs.length? verbs : VOCAB.filter(w=>w.pos==='verb' && (CONJ[w.de]||SEP_BASE[w.de]));
    shuffle(vpool).slice(0,3).forEach(w=> cand.push(genConj(w,tense)));
  }
  const sPool = sentencesByLevel(lvl).length? sentencesByLevel(lvl) : SENTENCES;
  shuffle(sPool).slice(0,2).forEach(s=> cand.push(genBuild(s)));
  shuffle(sPool).slice(0,2).forEach(s=> cand.push(genCloze(s,lvl)));
  cand.push(genListenSentence(pick(sPool)));

  let chosen = shuffle(cand.filter(Boolean));
  // guarantee at least one listening exercise (variety + daily quest)
  if(!chosen.some(c=>c.mode==='listen')) chosen.unshift(genListen(pick(words)));
  chosen = chosen.slice(0, 11);
  // pad if a sparse unit produced too few
  let guard=0;
  while(chosen.length<7 && guard++<20){
    const w=pick(vocabByLevel(lvl).length?vocabByLevel(lvl):VOCAB);
    chosen.push(genTrans(w, VOCAB, Math.random()<0.5?'de2nat':'nat2de'));
  }
  return items.concat(chosen.filter(Boolean));
}

/* ============================================================================
   11a. LESSON CONTROLLER — runs a queue of exercises (lessons, review, weak)
   ========================================================================== */
const PRAISE = {bs:['Bravo!','Odlično!','Tako je!','Super!','Perfektno!','Nastavi tako!'], en:['Nice!','Great!','Exactly!','Awesome!','Perfect!','Keep it up!']};
const NUDGE  = {bs:['Skoro!','Bez brige.','Zapamti ovo.','Ide to.','Idući put!'], en:['Almost!','No worries.','Remember this one.','You got this.','Next time!']};

const Lesson = {
  items:[], i:0, correct:0, total:0, combo:0, maxCombo:0, mistakes:[], meta:{}, phase:'q', _ex:null, _dock:null, courtesy:false,
  begin(items, meta){
    this.items=(items||[]).filter(Boolean); this.i=0; this.correct=0; this.total=0; this.combo=0; this.maxCombo=0;
    this.mistakes=[]; this.meta=meta||{}; this.phase='q'; this.courtesy=false;
    if(!this.items.length){ toast('—'); return route('home'); }
    route('lesson');
  },
  gradable(){ return this.items.filter(it=>it.mode!=='teach'); },
  gradedSoFar(){ let n=0; for(let k=0;k<this.i;k++) if(this.items[k].mode!=='teach') n++; return n; },
  screen(){
    const item=this.items[this.i]; this.phase='q';
    const ex=EX[item.mode](item); this._ex=ex;
    const wrap=el('div',{class:'screen'});
    // top bar
    const total=this.gradable().length;
    const bar=el('div',{class:'lesson-top'},
      el('button',{class:'xbtn', 'aria-label':t('close'), onclick:()=>this.confirmQuit(), html:'✕'}),
      el('div',{class:'lesson-bar'}, progressBar(this.gradedSoFar()/Math.max(1,total))),
      heartsBadge()
    );
    wrap.append(bar);
    wrap.append(el('div',{class:'exercise'}, el('div',{class:'ex-body'}, ex.node)));
    const dock=el('div',{class:'check-dock'}); this._dock=dock; wrap.append(dock);
    if(!ex.auto){
      const checkBtn=el('button',{class:'btn primary block lg', disabled:!ex.ready||!ex.ready(), onclick:()=>{
        const r=ex.result(); this.submit(r);
      }, text: item.mode==='teach'? t('cont') : t('check')});
      this._checkBtn=checkBtn; dock.append(checkBtn);
      if(item.mode!=='teach'){ dock.append(el('button',{class:'btn ghost block', style:'margin-top:8px', onclick:()=>this.submit(ex.result()), text:t('cant_answer')})); }
    }
    return wrap;
  },
  syncCheck(){ if(this._checkBtn && this._ex && this._ex.ready) this._checkBtn.disabled=!this._ex.ready(); },
  _wasNew(id){ return id && VOCAB_BY_ID[id] && !S.learned[id]; },
  submit(res){
    if(this.phase==='fb') return; this.phase='fb';
    const graded = !res.teach;
    if(graded){
      this.total++;
      const newWord = res.correct && this._wasNew(res.cardId);
      if(res.correct){ this.correct++; this.combo++; this.maxCombo=Math.max(this.maxCombo,this.combo);
        Audio_.play('correct'); if(this.combo>=2) comboFlash(this.combo); }
      else { this.combo=0; Audio_.play('wrong'); loseHeart(); this.mistakes.push(res); }
      if(res.cardId) reviewCard(res.cardId, res.quality!=null?res.quality:(res.correct?4:1));
      if(res.correct && this.items[this.i].mode==='listen'){ S.today.listening++; questProgress('listening',1); }
      if(newWord){ S.today.newWords++; questProgress('words',1); }
      save();
    } else { Audio_.play('click'); }
    this._renderFeedback(res, graded);
    if(graded && !res.correct && !isPlus() && heartsLeft()===0 && !this.courtesy){ setTimeout(()=>this.outOfHearts(),450); }
  },
  _renderFeedback(res, graded){
    const dock=this._dock; dock.innerHTML='';
    if(res.teach){ dock.append(el('button',{class:'btn primary block lg', onclick:()=>this.next(), text:t('cont')})); this._focusContinue(); return; }
    const ok=res.correct;
    const fb=el('div',{class:'feedback '+(ok?'ok':'no')},
      el('div',{class:'fb-head'}, el('span',{html:fritz(ok?'cheer':'think',40)}), el('span',{text: ok? pick(PRAISE[LANG]||PRAISE.en) : t('not_quite')})),
      (!ok && res.correctText)? el('div',{class:'fb-expl', html:'<b>'+t('correct_answer')+':</b> '+escapeHtml(res.correctText)}) : null,
      (res.explain)? el('div',{class:'fb-expl', html:escapeHtml(res.explain)}) : null,
      el('button',{class:'btn '+(ok?'good':'primary')+' block lg', style:'margin-top:12px', onclick:()=>this.next(), text:t('cont')})
    );
    dock.append(fb); this._focusContinue();
    announce((ok?t('correct'):t('not_quite'))+' '+(res.correctText||''));
  },
  _focusContinue(){ setTimeout(()=>{ const b=this._dock.querySelector('button:last-child'); b&&b.focus(); },30); },
  next(){ this.phase='q'; this.i++; if(this.i>=this.items.length) this.finish(); else route('lesson'); },
  outOfHearts(){ openOutOfHearts(()=>{ this.courtesy=true; }); },
  confirmQuit(){
    openModal(el('div',{}, el('h2',{text:LANG==='bs'?'Prekinuti lekciju?':'Quit the lesson?'}),
      el('p',{class:'muted', text:LANG==='bs'?'Napredak ove lekcije se neće sačuvati.':'This lesson\'s progress won\'t be saved.'}),
      el('div',{class:'grid2', style:'margin-top:14px'},
        el('button',{class:'btn ghost', onclick:()=>$$('.scrim').pop()?.click(), text:t('cancel')}),
        el('button',{class:'btn bad', onclick:()=>{ $$('.scrim').pop()?.click(); route(this.meta.back||'home'); }, text:LANG==='bs'?'Izađi':'Quit'})
      )), {center:true});
  },
  finish(){
    const graded=this.total; const acc = graded? Math.round(this.correct/graded*100) : 100;
    const perfect = graded>0 && this.mistakes.length===0;
    let xp = 10 + this.correct*2 + Math.floor(this.maxCombo/3)*2 + (perfect?5:0);
    // update stats + unit + quests
    S.stats.answers += graded; S.stats.correct += this.correct;
    if(this.meta.type==='unit'){
      const st=unitState(this.meta.unitId); st.done[this.meta.idx]=true; st.crown=unitCrown(this.meta.unitId);
      S.stats.lessons++; questProgress('lesson',1);
    }
    if(perfect){ S.stats.perfect++; questProgress('perfect',1); }
    const goalBefore = S.today.xp>=GOALS[S.goal].xp;
    const lvlRes = addXp(xp);        // handles level-up FX, league, achievements
    const goalNow = S.today.xp>=GOALS[S.goal].xp;
    Audio_.play('complete');
    saveNow();
    route('results', { correct:this.correct, total:graded, xp, acc, perfect, leveled:lvlRes.leveled,
      goalJustMet: !goalBefore && goalNow, meta:this.meta });
  }
};

  ));

function ring(pct, opts={}){
  const size=opts.size||120, sw=opts.stroke||12, r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-clamp(pct,0,1));
  const wrap=el('div',{class:'ring', style:`width:${size}px;height:${size}px`});
  wrap.innerHTML=`<svg width="${size}" height="${size}" aria-hidden="true">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg>`;
  const fg=wrap.querySelector('.ring-fg'); fg.style.stroke=opts.color||'var(--brand)';
  requestAnimationFrame(()=>fg.style.strokeDashoffset=off);
  if(opts.label!=null) wrap.append(el('div',{class:'ring-label', html:opts.label}));

function last7(){
  const out=[]; const today=dateKey();
  const names = LANG==='en'?['Mo','Tu','We','Th','Fr','Sa','Su']:['Po','Ut','Sr','Če','Pe','Su','Ne'];
  for(let i=6;i>=0;i--){ const k=addDays(today,-i); const d=parseKey(k); const wd=(d.getDay()+6)%7;
    const hit = (k===today? S.today.xp>0 : (S.history[k]>0)) || (S.streak.last && daysBetween(k,S.streak.last)>=0 && daysBetween(k,S.streak.last)<S.streak.count && false);
    out.push({k, label:names[wd], hit: k===today? S.today.xp>0 : !!S.history[k], today:k===today}); }
  return out;
}

function nextLesson(){

    for(let j=0;j<u.lessons;j++){ if(!st.done[j]) return {unitId:u.id, idx:j, unitIndex:i}; } }
  return null;
}

  // 8 escalating translate questions
  const qs=[];
  ['A1','A1','A2','A2','B1','B1','B2','B2'].forEach((lvl,i)=>{
    const w=pick(vocabByLevel(lvl).filter(x=>x.pos==='noun'||x.pos==='verb'||x.pos==='adj'));
    if(!w) return;
    const distr=sample(VOCAB.filter(x=>x.id!==w.id && x.pos===w.pos),3);
    qs.push({w, lvl, options:shuffle([w,...distr]), sel:null});
  });
  const form=el('div',{});
  qs.forEach((q,qi)=>{
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'row',style:'justify-content:space-between'}, el('b',{text:(qi+1)+'. '+q.w.head}), el('span',{class:'pill-tag',text:q.lvl})));
    const opts=el('div',{class:'options'});
    q.options.forEach(o=>{ const b=el('button',{class:'opt', onclick:()=>{ q.sel=o.id; $$('.opt',opts).forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }}, el('span',{text:nativeOf(o)})); opts.append(b); });
    card.append(opts); form.append(card);
  });
  wrap.append(form);

    let score=0, lvlScore={A1:0,A2:0,B1:0,B2:0};
    qs.forEach(q=>{ if(q.sel===q.w.id){ score++; lvlScore[q.lvl]++; } });
    // determine starting level
    let start=0;
    if(lvlScore.A1>=2 && score>=3) start=1;
    if(lvlScore.A2>=2 && score>=5) start=2;
    if(lvlScore.B1>=2 && score>=7) start=3;

    UNITS.forEach((u,idx)=>{ if(u.lvlIndex<start){ const st=unitState(u.id); for(let j=0;j<u.lessons;j++) st.done[j]=true; st.crown=Math.max(st.crown,1); } });

};

/* AI wrappers (Claude when key present, graceful offline fallbacks) */
async function aiExample(w){
  S._aiUsed=true; checkAchievements();
  const fb=()=> w.ex || (w.pos==='noun'? `Das ist ${w.art} ${w.de}.` : w.pos==='verb'? `Ich möchte ${w.de}.` : `Es ist ${w.de}.`);
  if(!AI_ENABLED) return {text:fb(), offline:true};
  if(aiQuotaLeft()<=0){ toast(t('ai_cap')); return {text:fb(), offline:true}; }
  try{ const txt=await askClaude('Du bist ein Deutschlehrer. Antworte NUR mit EINEM einfachen deutschen Beispielsatz (Niveau '+w.lvl+') für das Wort. Keine Übersetzung, keine Erklärung.', 'Wort: '+w.head, {maxTokens:60}); aiConsume(); return {text:txt.trim()}; }
  catch(e){ return {text:fb(), offline:true, error:e.message}; }
}
const FUNCTION_WORDS={der:'the',die:'the',das:'the',ein:'a',eine:'a',ich:'I',du:'you',er:'he',sie:'she/they',es:'it',wir:'we',ihr:'you(pl)',ist:'is',bin:'am',sind:'are',habe:'have',hat:'has',und:'and',nicht:'not',in:'in',auf:'on',mit:'with',zu:'to',nach:'to/after',ein:'a',kein:'no',sehr:'very',gern:'gladly',heute:'today',morgen:'tomorrow'};
function localBreakdown(sentence){
  const tokens=sentence.split(/\s+/).filter(Boolean);
  return tokens.map(tok=>{ const clean=tok.replace(/[.,!?;:„“"']/g,''); const low=clean.toLowerCase();
    const w=VOCAB.find(v=>v.de.toLowerCase()===low || (v.art && (v.art+' '+v.de).toLowerCase()===low));
    let gloss = w? nativeOf(w) : (FUNCTION_WORDS[low]||'—');
    return {de:clean, gloss}; });
}
async function aiBreakdown(sentence){
  S._aiUsed=true; checkAchievements();
  const fb=()=>null; // signals local table
  if(AI_ENABLED && aiQuotaLeft()>0){
    try{ const txt=await askClaude('Du bist ein Deutschlehrer. Analysiere den Satz Wort für Wort ('+(LANG==='bs'?'auf Bosnisch':'in English')+'): kurze Glosse pro Wort, dann 1 Satz zur Grammatik (Kasus/Wortstellung).', sentence, {maxTokens:350}); aiConsume(); return {text:txt}; }
    catch(e){}
  }
  return {local:localBreakdown(sentence)};
}

    RP_SCENARIOS.forEach(sc=> wrap.append(el('button',{class:'btn block lg', style:'margin-top:10px;justify-content:flex-start;gap:12px', onclick:()=>{ RP={scen:sc, msgs:[{role:'ai', text:sc.open}], step:0}; Audio_.speak(sc.open); route('roleplay'); }},
      el('span',{style:'font-size:1.4rem', text:sc.icon}), el('span',{text:sc.t[LANG]||sc.t.en}))));
    if(!AI_ENABLED) wrap.append(el('div',{class:'info-note', style:'margin-top:14px', text:LANG==='bs'?'Bez AI ključa razgovor koristi skriptu. Sa ključem Fritz vodi pravi razgovor i ispravlja te.':'Without an AI key the chat is scripted. With a key Fritz holds a real conversation and corrects you.'}));
    return wrap;
  }
  const sc=RP.scen;
  wrap.append(el('div',{class:'row', style:'gap:10px;margin-bottom:8px'}, el('span',{style:'font-size:1.4rem',text:sc.icon}), el('b',{text:sc.t[LANG]||sc.t.en})));
  const chat=el('div',{style:'display:flex;flex-direction:column;gap:10px;padding-bottom:8px'});
  function bubble(m){
    const ai=m.role==='ai';
    return el('div',{class:'row', style:'align-items:flex-end;gap:8px;'+(ai?'':'flex-direction:row-reverse')},
      ai? el('div',{html:fritz('happy',40)}) : el('span',{style:'font-size:1.6rem',text:'🧑'}),
      el('div',{class:'speech', style:'max-width:78%;'+(ai?'':'background:var(--accent);color:#fff;border-color:transparent'),
        onclick:ai?()=>Audio_.speak(m.text):null}, m.text));
  }
  RP.msgs.forEach(m=>chat.append(bubble(m)));
  wrap.append(chat);
  const input=el('input',{class:'type-in', placeholder:LANG==='bs'?'Napiši na njemačkom…':'Type in German…'});
  const send=async()=>{
    const txt=input.value.trim(); if(!txt) return; input.value='';
    RP.msgs.push({role:'me', text:txt}); chat.append(bubble(RP.msgs[RP.msgs.length-1]));
    const thinking=el('div',{class:'muted small',text:t('ai_thinking')}); chat.append(thinking); chat.scrollIntoView(false);
    let reply;
    if(AI_ENABLED && aiQuotaLeft()>0){
      try{ const conv=RP.msgs.map(m=>(m.role==='ai'?'Assistent: ':'Nutzer: ')+m.text).join('\n'); reply=await askClaude(sc.sys, conv+'\nAssistent:', {maxTokens:120}); aiConsume(); }
      catch(e){ reply=sc.canned[Math.min(RP.step,sc.canned.length-1)]; RP.step++; }
    } else { reply=sc.canned[Math.min(RP.step,sc.canned.length-1)]; RP.step++; }
    S._aiUsed=true; checkAchievements();
    thinking.remove();
    RP.msgs.push({role:'ai', text:reply}); chat.append(bubble(RP.msgs[RP.msgs.length-1])); Audio_.speak(reply); chat.scrollIntoView(false);
    addXp(2);
  };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  wrap.append(el('div',{class:'row', style:'gap:8px;position:sticky;bottom:0;padding:8px 0;background:var(--bg)'}, input, el('button',{class:'btn primary', onclick:send, text:t('send')})));
  return wrap;
};

    el('div',{class:'rs', style:'background:color-mix(in srgb,var(--good) 14%,var(--surface))'}, el('div',{class:'rs-v', style:'color:var(--good-ink)', text:p.acc+'%'}), el('div',{class:'rs-l', text:t('accuracy')})),

  ));
  if(p.goalJustMet){ wrap.append(el('div',{class:'card center', style:'background:color-mix(in srgb,var(--good) 14%, var(--surface))'}, el('b',{text:'🎉 '+t('goal_met')}))); }

  return wrap;
};

  const nameIn=el('input',{class:'type-in', placeholder:t('your_name'), value:name, oninput:e=>name=e.target.value});

  const langSeg=el('div',{class:'seg'}); [['bs','Bosanski'],['en','English']].forEach(([v,l])=> langSeg.append(el('button',{class:lang===v?'on':'', onclick:()=>{ lang=v; LANG=v; S.settings.lang=v; applySettings(); $$('button',langSeg).forEach(b=>b.classList.remove('on')); langSeg.querySelector('[data-v="'+v+'"]').classList.add('on'); }, 'data-v':v, text:l}))); card.append(langSeg);

  card.append(goalWrap);
  card.append(el('button',{class:'btn primary block lg', style:'margin-top:18px', onclick:()=>{
    S.profile.name=name.trim().slice(0,24); S.goal=goal; S.settings.lang=lang; LANG=lang; S.profile.onboarded=true;
    ensureQuests(); ensureLeague(); save(); applySettings(); Audio_.play('levelup'); FX.fire({big:true}); route('home');
  }, text:t('lets_go')+' 🚀'}));
  wrap.append(card);
  return wrap;
};

/* ============================================================================
   12. INIT — settings application, PWA manifest, boot, live timers
   ========================================================================== */
function applySettings(){
  const r=document.documentElement;
  r.setAttribute('data-theme', S.settings.theme||'auto');
  r.setAttribute('data-textsize', S.settings.textsize==='large'?'large':'normal');
  r.setAttribute('data-dyslexia', S.settings.dyslexia?'on':'off');
  r.setAttribute('data-reduce', S.settings.reduce?'on':'off');
  r.setAttribute('lang', S.settings.lang==='en'?'en':'bs');
}
function setupPWA(){
  const iconSvg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#ff7a1a"/><g transform="translate(6,6) scale(0.88)"><path d="M18 34 L30 10 L42 32 Z" fill="#ffb04d"/><path d="M82 34 L70 10 L58 32 Z" fill="#ffb04d"/><path d="M50 24 C74 24 84 42 84 58 C84 78 68 90 50 90 C32 90 16 78 16 58 C16 42 26 24 50 24 Z" fill="#ffedd8"/><circle cx="36" cy="54" r="4" fill="#2a1a0a"/><circle cx="64" cy="54" r="4" fill="#2a1a0a"/><path d="M50 62 l-5 -5 h10 Z" fill="#2a1a0a"/></g></svg>';
  const iconUrl='data:image/svg+xml,'+encodeURIComponent(iconSvg);
  const manifest={ name:'Lernfuchs — Deutsch A1–B2', short_name:'Lernfuchs', description:'Gamified German learning from A1 to B2.',
    start_url:'.', scope:'.', display:'standalone', orientation:'portrait', background_color:'#0d1020', theme_color:'#ff7a1a',
    icons:[ {src:iconUrl, sizes:'192x192', type:'image/svg+xml', purpose:'any maskable'}, {src:iconUrl, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'} ] };
  const mLink=$('#app-manifest'); if(mLink) mLink.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  const fav=$('#app-favicon'); if(fav){ fav.href=iconUrl; fav.type='image/svg+xml'; }
}
function tickTimers(){
  // regenerate hearts and refresh any visible countdowns
  const before=S.hearts.count;
  if(!isPlus() && S.hearts.count<S.hearts.max && nextHeartMs()<=0){ regenHearts(); }
  const clocks=[['#home-heartclock',()=>fmtMs(nextHeartMs())],['#sheet-heartclock',()=>fmtMs(nextHeartMs())],['#heartclock',()=>fmtMs(nextHeartMs())]];
  clocks.forEach(([sel,fn])=>{ const n=$(sel); if(n) n.textContent=fn(); });
  if(S.hearts.count!==before && CURRENT.screen==='home'){ render(); }
}
function init(){
  load();
  applySettings();
  setupPWA();
  checkStreakOnLoad();
  rolloverDay();
  regenHearts();
  ensureQuests(); ensureLeague();
  save();
  // Resume audio on first user gesture (autoplay policy)
  const resume=()=>{ Audio_.ensure&&Audio_.ensure(); document.removeEventListener('pointerdown',resume); document.removeEventListener('keydown',resume); };
  document.addEventListener('pointerdown',resume); document.addEventListener('keydown',resume);
  // Live timers
  setInterval(tickTimers, 1000);
  setInterval(()=>{ regenHearts(); save(); }, 30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ regenHearts(); if(S.today.date!==dateKey()) rolloverDay(); if(['lesson','results'].indexOf(CURRENT.screen)<0) render(); } });
  // First run → onboarding
  route(S.profile.onboarded? 'home' : 'onboarding');
  // expose for debugging / self-test
  window.LF={S, VOCAB, GRAMMAR, UNITS, VOCAB_BY_ID, route, addXp, startLesson, buildLesson, Lesson, EX,
    gen:{genPic,genTrans,genGender,genCase,genConj,genListen,genMemory,genBuild,genCloze,genSpeak,genListenSentence},
    pick, sentencesByLevel, vocabByLevel};
}

// Boot when DOM is ready
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
